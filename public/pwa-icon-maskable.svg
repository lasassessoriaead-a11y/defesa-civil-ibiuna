<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="shieldMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="triMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Full square background for maskable safety zone (80% inner content) -->
  <rect width="512" height="512" fill="url(#bgMask)" />

  <!-- Shield scaled inside safe area (centered, max 380px) -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <path d="M 256 70 
             C 336 96 406 106 406 106 
             C 406 250 380 376 256 442 
             C 132 376 106 250 106 106 
             C 106 106 176 96 256 70 Z" 
          fill="url(#shieldMask)" 
          stroke="#60a5fa" 
          stroke-width="8" />

    <polygon points="256,155 356,330 156,330" fill="url(#triMask)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

    <path d="M 244 215 H 268 V 242 H 295 V 266 H 268 V 293 H 244 V 266 H 217 V 242 H 244 Z" fill="#ffffff" />
  </g>
</svg>