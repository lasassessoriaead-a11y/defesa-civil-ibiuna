<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="triangleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background base rounded container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle ring border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.25" />

  <!-- Shield Shape with Shadow -->
  <g filter="url(#shadow)">
    <!-- Outer Shield -->
    <path d="M 256 70 
             C 336 96 406 106 406 106 
             C 406 250 380 376 256 442 
             C 132 376 106 250 106 106 
             C 106 106 176 96 256 70 Z" 
          fill="url(#shieldGrad)" 
          stroke="#60a5fa" 
          stroke-width="6" />

    <!-- Inner Shield Accent -->
    <path d="M 256 94 
             C 324 116 382 124 382 124 
             C 382 246 360 354 256 414 
             C 152 354 130 246 130 124 
             C 130 124 188 116 256 94 Z" 
          fill="#1e3a8a" 
          opacity="0.6" />

    <!-- International Civil Defence Orange Triangle Symbol -->
    <!-- The official international civil defence symbol is an equilateral blue triangle on an orange background, or orange triangle inside shield -->
    <polygon points="256,155 356,330 156,330" fill="url(#triangleGrad)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

    <!-- Alert / Rescue Center Symbol: Life & Preparedness stylized crest inside triangle -->
    <!-- White small emergency cross / shield core -->
    <path d="M 244 215 H 268 V 242 H 295 V 266 H 268 V 293 H 244 V 266 H 217 V 242 H 244 Z" fill="#ffffff" />
  </g>

  <!-- Lower Banner text: DEFESA CIVIL -->
  <text x="256" y="475" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#93c5fd" text-anchor="middle" letter-spacing="4">DEFESA CIVIL</text>
</svg>